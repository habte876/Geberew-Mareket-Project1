services:
  db:
    image: postgres:16
    container_name: geberewu-market-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geberewu
      POSTGRES_PASSWORD: geberewu
      POSTGRES_DB: geberewu_market
    ports:
      - "5433:5432"
    volumes:
      - geberewu_pg:/var/lib/postgresql/data

volumes:
  geberewu_pg:
